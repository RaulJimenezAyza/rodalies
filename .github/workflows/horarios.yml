# Cada lunes descarga el GTFS de Renfe, regenera los horarios de Rodalies y vuelve a publicar la web.
# Renfe solo publica unas 4 semanas de horarios: sin esto, la web se quedaría sin horarios.
#
# Necesita dos secretos del repositorio (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
# El repositorio es público, así que los minutos de Actions no cuentan para el cupo.
name: Horarios

on:
  schedule:
    - cron: '0 4 * * 1' # lunes a las 4:00 UTC
  workflow_dispatch: # y a mano desde la pestaña Actions

concurrency:
  group: horarios
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Horarios nuevos desde el GTFS de Renfe
        run: npm run horarios

      - name: Página en catalán
        run: npm run idiomas

      - name: Publicar la web
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy --branch main --commit-dirty=true
